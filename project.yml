# Progetto generato con XcodeGen sul runner macOS (nessun .xcodeproj nel repository).
name: Lieve
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: it

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"          # solo iPhone
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  Lieve:
    type: application
    platform: iOS
    sources:
      - path: Lieve
        excludes:
          - "Resources/FilterPack.lvp"
          - "Resources/*.hash"
          - "Resources/PrivacyInfo.xcprivacy"
      - path: Lieve/Resources/FilterPack.lvp
        buildPhase: resources
      - path: Lieve/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    scheme:
      testTargets:
        - LieveUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lieve   # sovrascritto dalla CI con la variabile BUNDLE_ID
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # Impostati dalla CI se è configurata la chiave di firma dei filtri (aggiornamenti remoti).
        LIEVE_FILTERS_URL: ""
        LIEVE_FILTERS_PUBKEY: ""
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Lieve
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Necessario per audio in background e Picture-in-Picture.
        UIBackgroundModes: [audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Consente di aprire siti http:// nella WebView (un browser deve poterlo fare).
        # NON disattiva la validazione TLS per i siti https.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        # Evita la domanda sulla crittografia a ogni upload TestFlight.
        ITSAppUsesNonExemptEncryption: false
        # Aggiornamento filtri: URL del pacchetto e chiave pubblica Ed25519 (vuoti = disattivato).
        LieveFiltersURL: $(LIEVE_FILTERS_URL)
        LieveFiltersPublicKey: $(LIEVE_FILTERS_PUBKEY)

  LieveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LieveUITests
    dependencies:
      - target: Lieve
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lieve.uitests
        TEST_TARGET_NAME: Lieve
