name: Simulatore

# Prova d'uso nel simulatore iPhone: tocchi, scorrimento, menu, fogli, trascinamento.
# Gli screenshot finiscono nel branch "simulator-screenshots"; la build per Appetize.io negli artifact.

on:
  push:
    branches: [main]
    paths: ["Lieve/**", "LieveUITests/**", "project.yml", ".github/workflows/simulator.yml"]
  workflow_dispatch:
    inputs:
      only:
        description: "Esegui solo questa classe di test (es. StartTimeTests)"
        required: false

permissions:
  contents: write

concurrency:
  group: simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-test:
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26-intel' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Test, filtri e progetto
        run: bash ci/prepare.sh

      - name: Scegli il simulatore
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          print(next(x["udid"] for k, v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: Test UI (tocchi reali)
        run: |
          set +e
          xcodebuild test -project Lieve.xcodeproj -scheme Lieve -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            CODE_SIGNING_ALLOWED=NO ${{ inputs.only && format('-only-testing:LieveUITests/{0}', inputs.only) || '' }} > test.log 2>&1
          STATUS=$?
          grep -E "error:|Test Case|L'app si è chiusa|\*\* TEST|crash|METRIC|MINIPLAYER" test.log | sort -u | head -60
          echo "===== Tempi di avvio"
          grep -E "^METRIC|METRIC " test.log | sed 's/.*METRIC/METRIC/' | sort -u
          exit $STATUS

      - name: Rapporti di crash
        if: failure()
        run: |
          find ~/Library/Logs/DiagnosticReports -name "Lieve*" -mmin -60 2>/dev/null | head -3 | while read f; do
            echo "=== $f"; head -c 6000 "$f"; echo; done

      - name: Estrai screenshot
        if: always()
        run: |
          mkdir -p shots
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path shots >/dev/null 2>&1 || true
          cp test.log shots/ 2>/dev/null || true
          ls -l shots

      - name: Build per Appetize.io
        if: always()
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name Lieve.app -path "*iphonesimulator*" | head -1)
          [ -n "$APP" ] && (cd "$(dirname "$APP")" && zip -qry "$RUNNER_TEMP/Lieve-simulator.zip" Lieve.app) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lieve-simulator
          path: ${{ runner.temp }}/Lieve-simulator.zip
          if-no-files-found: ignore
          retention-days: 14

      - name: Pubblica screenshot
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp -R shots "$RUNNER_TEMP/shots"
          git checkout --orphan screenshots-tmp
          git rm -rf --quiet . && git clean -fdqx
          cp -R "$RUNNER_TEMP"/shots/. .
          git add -A
          git commit -qm "Screenshot simulatore $GITHUB_RUN_NUMBER" || exit 0
          git push -f origin HEAD:simulator-screenshots
